<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    .navbar {
        display: flex;
        flex-direction: row;
        gap:20px;
        background-color:rgb(240, 171, 234);
        width: 100%;
        padding: 10px;
        height: 50px;
        text-align: center;
        font-size: 25px;
    }

    @media (max-width: 768px) {
        .navbar {
            flex-direction: column; 
        }
    }
    .navbar a:hover{
        color: green;
        font-size: 32px;
        text-decoration: underline;
    }
    .navbar a {
        text-decoration: none;
        color: black;
        transition: all 0.3s ease;
    }
    </style>
</head>
<body>

<nav class="navbar">
    <a href="#">Home</a> 
    <a href="#">About</a>
    <a href="#">Services</a> 
    <a href="#">Contact</a>
</nav>

</body>
</html>
