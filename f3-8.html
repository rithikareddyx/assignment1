<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap:15px;
        }
        .container img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
        }
        @media (max-width: 768px) {
            .container {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 480px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
        .container img:hover {
            transform: scale(1.2);
            transition: all 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="art.jpg">
        <img src="bg.jpeg">
        <img src="bookfair.jpg">
        <img src="dance.jpeg">
        <img src="dance.jpeg">
        <img src="food.jpg">
        <img src="art.jpg">
        <img src="sports.jpg">
    </div>
</body>
</html>
