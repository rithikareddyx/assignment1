<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .card img{
            width: 180px;
            height: 180px;
        }
        .card {
            display: flex;
            align-items: center;
            gap: 20px;
            border: 1px solid black;
            padding: 10px;
            width: 300px;
            margin: 50px auto;
        }
        .card img:hover{
            transform: scale(1.2);
            transition: all 0.3s ease;
        }
        button {
            padding: 5px;
            background-color: rgb(107, 177, 235);
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        button:hover {
            background-color: green;
            transform: scale(1.1);
        }
    </style>
 
</head>
<body>
    <div class="card">
        <img src="image2.png" alt="Product Image">
        <div class="details">
            <h4>Product Name</h4>
            <p>Price: $19.99</p>
            <button>Buy Now</button>
        </div>
    </div>
</body>
</html>
