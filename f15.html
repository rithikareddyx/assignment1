<!DOCTYPE html>
<html>
<head>
    <title>Student Management System</title>

    <style>
        *{
            margin:0;
            padding:0;
        }

        header{
            background: navy;
            color:white;
            padding:15px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        nav a{
            color:white;
            text-decoration:none;
            margin:10px;
        }

        .hero{
            text-align:center;
            padding:50px;
            animation:fadeIn 2s;
        }

        button{
            padding:10px;
            margin-top:10px;
            transition:0.3s;
        }

        button:hover{
            background:lightblue;
            transform:scale(1.1);
        }

        .features{
            text-align:center;
            padding:20px;
        }

        .card{
            border:1px solid black;
            margin:10px;
            padding:15px;
        }

        footer{
            background:navy;
            color:white;
            text-align:center;
            padding:10px;
        }

        @keyframes fadeIn{
            from{opacity:0;}
            to{opacity:1;}
        }

        @media(max-width:768px){
            header{
                flex-direction:column;
            }
        }
    </style>
</head>

<body>

    <header>
        <div>
            <img src="logo.png" alt="Logo" width="60">
            <h2>CVR College</h2>
        </div>

        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <section class="hero">
        <h1>Welcome to Student Management System</h1>
        <p>Manage Students, Attendance and Results</p>
        <button>Register Now</button>
    </section>

    <section class="features">
        <h2>Features</h2>

        <div class="card">
            <h3>Student Registration</h3>
  
        </div>

        <div class="card">
            <h3>Attendance</h3>
        </div>

        <div class="card">
            <h3>Results</h3>
        </div>
    </section>

    <footer>
        <p></p> 2026 CVR College. All Rights Reserved.</p>
    </footer>

</body>
</html>
